trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  appName: 'reactappservicewithcicd'
  resourceGroup: 'Anurag-rg'
  buildDir: 'dist'
  packageDir: '$(System.DefaultWorkingDirectory)'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '22.x'
  displayName: 'Use Node.js'

- script: |
    npm install
    npm install --save serve  # Add serve for production
    npm run build
  displayName: 'Install dependencies and build Vite app'

# Include package.json and node_modules in the archive
- task: ArchiveFiles@2
  inputs:
    rootFolderOrFile: '$(packageDir)'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/app.zip'
    replaceExistingArchive: true
    # Exclude unnecessary files but keep package.json and node_modules/serve
    excludeFilePattern: |
      node_modules/!(serve)/**
      src/**
      public/**
      *.md
      .git/**
  displayName: 'Archive application'

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)/app.zip'
    ArtifactName: 'drop'
  displayName: 'Publish artifact'

- task: AzureWebApp@1
  inputs:
    azureSubscription: 'react-app-service-connection'
    appType: 'webAppLinux'
    appName: '$(appName)'
    package: '$(Build.ArtifactStagingDirectory)/app.zip'
  displayName: 'Deploy to Azure Web App'



  
