trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  appName: 'reactappservicewithcicd'
  resourceGroup: 'Anurag-rg'
  buildDir: 'dist'  # ✅ for Vite
  packageDir: '$(System.DefaultWorkingDirectory)'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '22.x'  # ✅ or the Node version you need
  displayName: 'Use Node.js'

- script: |
    npm install
    npm run build
  displayName: 'Install dependencies and build Vite app'

- task: ArchiveFiles@2
  inputs:
    rootFolderOrFile: '$(packageDir)/$(buildDir)'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/app.zip'
    replaceExistingArchive: true
  displayName: 'Archive dist/ folder'

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)/app.zip'
    ArtifactName: 'drop'
  displayName: 'Publish artifact'

- task: AzureWebApp@1
  inputs:
    azureSubscription: 'react-app-service-connection'  # <-- use your service connection name here!
    appType: 'webAppLinux'
    appName: '$(appName)'
    package: '$(Build.ArtifactStagingDirectory)/app.zip'
  displayName: 'Deploy to Azure Web App'