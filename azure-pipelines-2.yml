trigger:
  branches:
    include:
      - master

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: Build
    jobs:
      - job: Build
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
            displayName: 'Install Node.js'

          - script: |
              npm install
              npm run build
            displayName: 'Install dependencies and build'

          - task: CopyFiles@2
            inputs:
              contents: 'dist/**'
              targetFolder: '$(Build.ArtifactStagingDirectory)'
            displayName: 'Copy build output'


          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'drop'
            displayName: 'Publish Artifact'

  - stage: Deploy
    dependsOn: Build
    jobs:
      - job: Deploy
        steps:
          - download: current
            artifact: drop

          - task: AzureRmWebAppDeployment@4
            inputs:
              ConnectionType: 'AzureRM'
              azureSubscription: 'react-app-service-connection'
              appType: 'webAppLinux'  # use 'webApp' if on Windows
              WebAppName: 'reactappservicewithcicd'
              packageForLinux: '$(Pipeline.Workspace)/drop'
            displayName: 'Deploy to Azure App Service'
